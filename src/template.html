<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book</title>
    <link rel="icon" href="data:," />
    <!--META-->
    <link rel="stylesheet" href="style.css" />

    <!--PRINT-ONLY-START-->
    <!--
    Preview chrome. Kept out of style.css so paged.js's Polisher doesn't strip
    it while processing the print stylesheet. paged.js ignores <style
    media="screen">.
    -->
    <style media="screen">
      body {
        background: #f0f0f0;
      }
      /* Exactly two pages per row at any window width — a spread is a
         spread. --fit (set by the preview) zooms it down to fit.
         --fit stays unset until pagination finishes: zooming mid-render
         changes the metrics paged.js measures against and pagination
         stalls partway through the book. See fit() in preview.ts. */
      .pagedjs_pages {
        display: grid;
        grid-template-columns: repeat(2, max-content);
        justify-content: center;
        zoom: var(--fit, 1);
        /* Clear the preview's top ruler. */
        padding-top: 40px;
      }
      .pagedjs_page {
        background: white;
        margin: 20px 0;
        border: 1px solid #bbb;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .pagedjs_left_page {
        margin-right: 0;
      }
      .pagedjs_right_page {
        margin-left: 0;
      }
      /* Page 1 is a recto; reserve a page-sized phantom slot to its left so it
         sits alone on the right, and pages 2/3, 4/5, ... wrap into real verso
         recto spreads. Width defaults to A5; override w/ --preview-page-width. */
      .pagedjs_pages::before {
        content: "";
        width: var(--preview-page-width, 148mm);
      }
    </style>

    <!--
    Register the OuterMargin handler BEFORE paged.polyfill.js loads.
    paged.js strips selectors targeting .pagedjs_left_page /
    .pagedjs_right_page out of user stylesheets, so we do the
    left/right swap in JS instead. Works in preview AND export.
    -->
    <script>
      window.PagedConfig = {
        before() {
          class OuterMargin extends window.Paged.Handler {
            afterPageLayout(pageElement) {
              // A page left empty by a forced break (e.g. the verso after a
              // cover's break-after) carries no folio. paged.js only tags
              // pages IT generated as .pagedjs_blank_page, so detect it here.
              const content = pageElement.querySelector(
                ".pagedjs_page_content",
              );
              if (content && !content.textContent.trim()) {
                pageElement.classList.add("pagedjs_empty_page");
                pageElement
                  .querySelectorAll(".pagedjs_margin-content")
                  .forEach((el) => (el.style.display = "none"));
              }

              const isLeft = pageElement.classList.contains("pagedjs_left_page");

              // Page parity, for stylesheets that need it: paged.js strips
              // .pagedjs_left_page / .pagedjs_right_page selectors out of
              // user CSS, but a custom property inherits down untouched.
              pageElement.style.setProperty("--recto", isLeft ? "0" : "1");

              const side = isLeft ? "left" : "right";
              const other = isLeft ? "right" : "left";
              pageElement.querySelectorAll(".margin").forEach((el) => {
                el.style.float = side;
                el.style.setProperty(`margin-${side}`, "-3.5cm", "important");
                el.style.removeProperty(`margin-${other}`);
              });
            }
          }
          window.Paged.registerHandlers(OuterMargin);
        },
      };
    </script>
    <!--PRINT-ONLY-END-->

    <!--PRETEXT-->
    <!--PAGEDJS-->
  </head>

  <body>
    <!--BODY-->
  </body>
</html>
